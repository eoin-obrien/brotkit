[project]
name = "brotkit"
version = "0.0.2"
description = "GPU-accelerated, SymPy-driven fractal rendering for notebooks"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Eoin O'Brien" }]
requires-python = ">=3.14"
keywords = ["fractal", "mandelbrot", "julia", "buddhabrot", "sympy", "numba", "cuda", "jupyter"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=3.20",
    "platformdirs>=4.5",
]

[project.optional-dependencies]
# Exact pin from spike S1 (docs/design/spikes/S1.md, ADR-0005). The cu13 extra pulls the
# NVIDIA runtime/compiler wheels (cuda-toolkit[cudart,nvcc,nvrtc], nvidia-nvjitlink).
cuda = ["numba-cuda-mlir[cu13]==0.6.0"]
video = ["av"]

[project.urls]
Repository = "https://github.com/eoin-obrien/brotkit"
Issues = "https://github.com/eoin-obrien/brotkit/issues"

[dependency-groups]
dev = [
    "commitizen>=4.20",
    "hypothesis>=6.170",
    "mpmath>=1.3",
    "numpy>=2.5",  # test simulations (test_chunks); the [cuda] extra brings it at runtime
    "packaging>=25",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
    "pytest>=9.2",
    "pytest-markdown-docs>=0.9.2",
    "pytest-randomly>=3.16",
    "ruff>=0.17.6",
    "zizmor>=1.33.1",
]
docs = [
    "myst-nb>=1.4",
    "pydata-sphinx-theme>=0.24",
    # Capped below 9: myst-nb on Sphinx 9 needs markdown-it-py>=4.2, but
    # pytest-markdown-docs (dev group) pins markdown-it-py<4. Lift the cap when it
    # supports markdown-it-py 4. See ADR-0002 in docs/design/decisions.md.
    "sphinx>=8.2,<9",
    "sphinx-llms-txt>=0.7.1",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.14.0"]
build-backend = "uv_build"

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "S307",     # no eval() -- see AGENTS.md invariants
    "TID251",   # banned imports -- GPU JIT only in backends/cuda.py (AGENTS.md invariant 8)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numba_cuda_mlir".msg = "Import numba_cuda_mlir only in src/brotkit/backends/cuda.py (AGENTS.md invariant 8)."
"numba.cuda".msg = "brotkit's GPU JIT is numba-cuda-mlir (ADR-0005); use src/brotkit/backends/cuda.py."

[tool.ruff.lint.per-file-ignores]
"src/brotkit/backends/cuda.py" = ["TID251"]
"spikes/**" = ["TID251"]   # throwaway spike code; see docs/design/spikes/

[tool.ruff.format]
docstring-code-format = true
# The design docs are hand-formatted snapshots; their code blocks are sketches.
exclude = ["docs/design/**"]

# --- pyright ----------------------------------------------------------------

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools"]   # tests import the dev tools in tools/ (not a package)
typeCheckingMode = "strict"

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]   # tests/test_gpu_gate.py, tests/test_gpu_check.py
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "gpu: needs a CUDA GPU (run with -m gpu; excluded from CPU CI)",
    "slow: long-running test",
    "perf: asserts on timings; gpu_check runs it only with --perf, on an idle GPU",
]

# --- commitizen -------------------------------------------------------------

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"   # also keeps uv.lock in step
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
