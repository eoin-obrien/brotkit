name: zizmor

# Static security audit of the GitHub Actions workflows (https://docs.zizmor.sh/).
# It runs on every PR, not only workflow changes, because it is a required check and a
# path-filtered required check never reports on other PRs, which blocks them (ADR-0010).
# The release workflow holds publish rights, so regressions there (unpinned actions,
# template injection, persisted credentials, cache poisoning) must not land unnoticed.
# zizmor is locked in the dev group, so Dependabot updates it with the other tools.
on:
  pull_request:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: zizmor
        env:
          # Online audits (impostor commits, known-vulnerable actions) need read access
          # to the GitHub API.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --only-group dev zizmor --format=github .github/workflows
