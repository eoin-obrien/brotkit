name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # 3.15 may fail until spike S1 confirms wheel availability; 3.14 is required.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14"
            experimental: false
          - python: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The golden references (tests/golden/*.npz) are in Git LFS. Cache the objects, keyed on
      # the manifest (which holds every file's sha256), so normal runs don't fetch from LFS.
      - name: Cache LFS objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-golden-${{ hashFiles('tests/golden/manifest.json') }}

      - name: Check out LFS files
        run: git lfs pull

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run --frozen ruff check

      - name: Format
        run: uv run --frozen ruff format --check

      - name: Typecheck
        run: uv run --frozen pyright

      # pytest-randomly shuffles the order and prints its seed in the log header; the JUnit
      # file names any failing test. Together they make the next unreproduced failure
      # reproducible (`-p randomly --randomly-seed=<seed>`). tools/gpu_check.py uses the same.
      - name: Test (CPU)
        env:
          PY: ${{ matrix.python }}
        run: uv run --frozen pytest -m "not gpu" --junitxml="junit-cpu-$PY.xml"

      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-cpu-${{ matrix.python }}
          path: junit-cpu-${{ matrix.python }}.xml
          if-no-files-found: warn
          retention-days: 30
