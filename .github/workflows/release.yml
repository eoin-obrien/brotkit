name: Release

# Manually triggered release (backlog 0.5). One run:
#   tests -> cz bump (version, CHANGELOG.md, tag) -> uv build -> push -> TestPyPI
#   -> install check -> PyPI (after approval of the protected `pypi` environment).
# Publishing uses Trusted Publishing (OIDC), so no tokens are stored. The PyPI and
# TestPyPI trusted publishers are bound to this file name and to the `pypi` and
# `testpypi` environments: renaming either breaks publishing.
#
# If a publish job fails after the tag is pushed, use "Re-run failed jobs". The
# built dist is kept as an artifact, so the re-run uploads the same files.
#
# Actions are pinned to commit SHAs here (this workflow holds publish rights);
# Dependabot updates the pins and the version comments.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: >-
          Version increment. "auto" derives it from the Conventional Commits since
          the last tag; pick PATCH, MINOR or MAJOR to force one, even with no
          eligible commits (0.x: a breaking change bumps MINOR).
        type: choice
        options: [auto, PATCH, MINOR, MAJOR]
        default: auto

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, tag and build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the bump commit and tag to main
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # cz bump reads every commit since the last tag
          persist-credentials: false   # the push step passes the token itself

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          # No cache in a workflow that publishes (cache-poisoning risk). Also, with the
          # cache on and nothing to save, setup-uv's post step fails the job.
          enable-cache: false

      - name: Install
        run: uv sync --locked --group dev

      - name: Test (CPU)
        run: uv run --frozen pytest -m "not gpu"

      - name: cz bump
        id: bump
        env:
          INCREMENT: ${{ inputs.increment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before="$(uv version --short)"
          args=(--yes)
          if [ "$INCREMENT" != "auto" ]; then
            # Without --allow-no-commit, a forced increment with no new commits exits 0
            # and bumps nothing.
            args+=(--increment "$INCREMENT" --allow-no-commit)
          fi
          uv run --frozen cz bump "${args[@]}"
          after="$(uv version --short)"
          if [ "$after" = "$before" ]; then
            echo "::error::cz bump left the version at $before"
            exit 1
          fi
          git rev-parse --verify "refs/tags/v$after" >/dev/null
          echo "version=$after" >> "$GITHUB_OUTPUT"
          echo "### Releasing brotkit $after (was $before)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: uv build --no-sources

      - name: Smoke-test the wheel
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          uv run --isolated --no-project --with dist/brotkit-"$VERSION"-py3-none-any.whl \
            python -c "import brotkit, sys; assert brotkit.__version__ == sys.argv[1], brotkit.__version__" \
            "$VERSION"

      # Push only after the build passed, and atomically, so main and the tag move
      # together. Fails if main moved during the run; nothing is published then.
      - name: Push bump commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: bump
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/brotkit/${{ needs.bump.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-install:
    name: Install from TestPyPI
    needs: [bump, testpypi]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          # No cache in a workflow that publishes (cache-poisoning risk). Also, with the
          # cache on and nothing to save, setup-uv's post step fails the job.
          enable-cache: false

      - name: Install and import
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          # The index can lag the upload by a minute or two.
          for attempt in 1 2 3 4 5 6; do
            if uv run --isolated --no-project --no-cache \
                --default-index https://test.pypi.org/simple/ \
                --with "brotkit==$VERSION" \
                python -c "import brotkit, sys; assert brotkit.__version__ == sys.argv[1]" "$VERSION"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          echo "::error::brotkit $VERSION did not install from TestPyPI"
          exit 1

  pypi:
    name: Publish to PyPI
    needs: [bump, testpypi-install]
    runs-on: ubuntu-latest
    environment:
      name: pypi   # protected: needs a maintainer's approval
      url: https://pypi.org/project/brotkit/${{ needs.bump.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
